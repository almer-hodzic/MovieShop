<div class="upsert-page">
  <div class="title-row">
    <h1>{{ title }}</h1>
  </div>

  <div class="form-container">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>First Name</mat-label>
          <input matInput formControlName="firstName" maxlength="100" />
          <mat-error *ngIf="hasError('firstName')">
            {{ getErrorMessage('firstName') }}
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Last Name</mat-label>
          <input matInput formControlName="lastName" maxlength="100" />
          <mat-error *ngIf="hasError('lastName')">
            {{ getErrorMessage('lastName') }}
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Birth Date</mat-label>
          <input matInput [matDatepicker]="birthDatePicker" formControlName="birthDate" />
          <mat-datepicker-toggle matSuffix [for]="birthDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #birthDatePicker></mat-datepicker>
          <mat-error *ngIf="hasError('birthDate')">
            {{ getErrorMessage('birthDate') }}
          </mat-error>
        </mat-form-field>

        @if (errorMessage) {
          <div class="error">{{ errorMessage }}</div>
        }

        <div class="actions">
          <button mat-stroked-button type="button" (click)="onCancel()">Cancel</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="isLoading">
            {{ isEditMode ? 'Save Changes' : 'Create Director' }}
          </button>
        </div>
      </form>
  </div>
</div>
