<div class="admin-category">
  <div class="form-container">
    <h3>Category Management</h3>
    <div class="management-tools">
      <mat-form-field appearance="outline">
        <mat-label>Category Name</mat-label>
        <input
          matInput
          #searchBox
          [value]="request.categoryName ?? ''"
          (keyup.enter)="onSearch(searchBox.value)"
          placeholder="Category Name"
        />
      </mat-form-field>
      <button mat-raised-button color="primary" type="button" (click)="onSearch(searchBox.value)">
        Search
      </button>
      <button mat-raised-button color="primary" type="button" (click)="onCreate()">
        Add Category
      </button>
    </div>
  </div>

  @if (isLoading) {
    <div class="loading-state"><app-spinner></app-spinner></div>
  } @else if (errorMessage) {
    <div class="state error">{{ errorMessage }}</div>
  } @else {
    <div class="category-list">
      @for (category of items; track category.id) {
        <div class="category-card">
          <div class="category-info">
            <h4>{{ category.categoryName }}</h4>
            <div class="category-actions">
              <button mat-raised-button color="primary" type="button" (click)="onEdit(category)">Edit</button>
              <button mat-raised-button color="warn" type="button" (click)="onDelete(category)">Delete</button>
            </div>
          </div>
        </div>
      } @empty {
        <div class="state">No categories found.</div>
      }
    </div>

    <div class="movie-paginator">
      <button mat-stroked-button type="button" (click)="prevPage()" [disabled]="paging.page <= 1">Previous</button>
      <span>Page {{ paging.page }} of {{ totalPages || 1 }}</span>
      <button mat-stroked-button type="button" (click)="nextPage()" [disabled]="paging.page >= totalPages">Next</button>
    </div>
  }
</div>
