<div class="movieshop-confirm">
  <h2 mat-dialog-title>{{ data.title }}</h2>
  <button mat-icon-button type="button" class="close-button" [mat-dialog-close]="false" aria-label="Close dialog">
    <mat-icon>close</mat-icon>
  </button>

  <mat-dialog-content>
    <p>{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button type="button" [mat-dialog-close]="false">{{ cancelText }}</button>
    <button mat-raised-button type="button" [ngClass]="tone" [mat-dialog-close]="true">{{ confirmText }}</button>
  </mat-dialog-actions>
</div>
